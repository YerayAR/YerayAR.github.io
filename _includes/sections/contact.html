<section id="contact" class="content-section">
    <div class="section-content">
    <h2 data-lang="contact-title">Contacto</h2>
    <div class="contact-layout">
      <div class="contact-illustration contact-illustration--local" aria-hidden="true">
        <span class="contact-orbit contact-orbit--one"></span>
        <span class="contact-orbit contact-orbit--two"></span>
        <div class="contact-mail-card">
          <div class="contact-mail-card__header">
            <span class="contact-mail-card__avatar"></span>
            <span class="contact-mail-card__badge"></span>
          </div>
          <div class="contact-mail-card__body">
            <span class="contact-mail-card__line contact-mail-card__line--lg"></span>
            <span class="contact-mail-card__line"></span>
            <span class="contact-mail-card__line contact-mail-card__line--sm"></span>
          </div>
          <div class="contact-mail-card__envelope">
            <span class="contact-mail-card__flap"></span>
            <span class="contact-mail-card__letter"></span>
          </div>
        </div>
        <span class="contact-signal contact-signal--one"></span>
        <span class="contact-signal contact-signal--two"></span>
      </div>
      <form id="contactForm">
        <div class="hp-field">
          <label for="company">Empresa</label>
          <input type="text" id="company" name="company" autocomplete="off" tabindex="-1">
        </div>
        <label for="name" data-lang="contact-name">Nombre:</label>
        <input type="text" id="name" name="name" required>

        <label for="email" data-lang="contact-email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="message" data-lang="contact-message">Mensaje:</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit" data-lang="contact-submit">Enviar</button>
      </form>
    </div>
    </div>
  </section>
